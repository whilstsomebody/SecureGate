name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

    env:
      REDIS_ADDR: 127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./... -timeout 60s

      - name: Integration test (real Redis)
        run: go test -race -v ./test/integration/... -timeout 60s

      - name: Build gateway
        run: go build -o /dev/null ./cmd/gateway

      - name: Build non-root gateway image
        run: docker build --tag securegate:ci .
